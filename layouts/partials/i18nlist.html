{{ if .IsTranslated }}
<nav class="post-translations" aria-label="Translations">
  <span class="post-translations-label">{{ partial "icon.html" (dict "ctx" $ "name" "globe") }} Also in:</span>
  {{ range .Translations }}
  <a class="translation-pill" href="{{ .Permalink }}">
    {{ .Language.Label | default .Language.Lang }} · {{ .Title }}
  </a>
  {{ end }}
</nav>
{{ end }}
