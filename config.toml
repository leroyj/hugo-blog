baseURL = 'https://blog.djoo.org/'
locale = 'en-us'
title = 'My tech blog'
theme = "m10c"
DefaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
googleAnalytics = 'G-4K18JZ28X6'
enableEmoji = true

[privacy]
  [privacy.googleAnalytics]
    anonymizeIP = true
    respectDoNotTrack = true

[caches]
  [caches.images]
    dir = ':cacheDir/images'

